name: 2bighacrm

services:

  redis:
    image: redis:7-alpine
    container_name: 2bighacrm-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    # Optional — API runs fine without Redis; set REDIS_URL on backend to enable cache.

  mongodb:
    image: mongo:8.2
    container_name: 2bighacrm-mongodb
    restart: always
    stop_grace_period: 30s
    mem_limit: 1536m
    memswap_limit: 1536m
    oom_score_adj: -500
    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - '0.5'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    image: ${BACKEND_IMAGE:-myapp_backend:latest}
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: 2bighacrm-backend
    restart: always
    expose:
      - "4000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.2bighacrm-backend.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.2bighacrm-backend.priority=2"
      - "traefik.http.routers.2bighacrm-backend.entrypoints=websecure"
      - "traefik.http.routers.2bighacrm-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.2bighacrm-backend.loadbalancer.server.port=4000"
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/mathionix-crm}
      - MONGO_URI_CRM=${MONGO_URI_CRM:-${MONGO_URI:-mongodb://mongodb:27017/mathionix-crm}}
      - MONGO_URI_PM=${MONGO_URI_PM:-${MONGO_URI:-mongodb://mongodb:27017/mathionix-crm}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_CACHE_TTL_SECONDS=${REDIS_CACHE_TTL_SECONDS:-180}
      - REDIS_CACHE_TTL_PM_BOARD_SECONDS=${REDIS_CACHE_TTL_PM_BOARD_SECONDS:-60}
      - REDIS_CACHE_TTL_CRM_LIST_SECONDS=${REDIS_CACHE_TTL_CRM_LIST_SECONDS:-90}
      - REDIS_CACHE_TTL_CRM_BOARD_SECONDS=${REDIS_CACHE_TTL_CRM_BOARD_SECONDS:-60}
      - REDIS_CACHE_TTL_CRM_REPORTING_SECONDS=${REDIS_CACHE_TTL_CRM_REPORTING_SECONDS:-90}
      - REDIS_CACHE_TTL_CRM_DETAIL_SECONDS=${REDIS_CACHE_TTL_CRM_DETAIL_SECONDS:-120}
      - REDIS_CACHE_TTL_CRM_PICKER_SECONDS=${REDIS_CACHE_TTL_CRM_PICKER_SECONDS:-300}
      - REDIS_CACHE_TTL_WIKI_SECONDS=${REDIS_CACHE_TTL_WIKI_SECONDS:-90}
      - REDIS_CACHE_TTL_SEARCH_SECONDS=${REDIS_CACHE_TTL_SEARCH_SECONDS:-45}
      - REDIS_CACHE_TTL_SOCIAL_PUBLIC_SECONDS=${REDIS_CACHE_TTL_SOCIAL_PUBLIC_SECONDS:-300}
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - MICROSOFT_CALLBACK_URL=${MICROSOFT_CALLBACK_URL}
      - CRM_INBOX_GOOGLE_CLIENT_ID=${CRM_INBOX_GOOGLE_CLIENT_ID}
      - CRM_INBOX_GOOGLE_CLIENT_SECRET=${CRM_INBOX_GOOGLE_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CRM_OAUTH_PUBLIC_URL=${CRM_OAUTH_PUBLIC_URL}
      - SITE_CMS_PUBLIC_API_KEY=${SITE_CMS_PUBLIC_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      - BOT_SERVICE_URL=${BOT_SERVICE_URL}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - TEAMS_SENDER_ID=${TEAMS_SENDER_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL}
      - PM_GITHUB_CLIENT_ID=${PM_GITHUB_CLIENT_ID}
      - PM_GITHUB_CLIENT_SECRET=${PM_GITHUB_CLIENT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - SEMRUSH_API_KEY=${SEMRUSH_API_KEY:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - SEO_SIMULATE_RANK=${SEO_SIMULATE_RANK:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-dall-e-3}
      - IMAGE_GEN_PROVIDER=${IMAGE_GEN_PROVIDER:-auto}
      - IMAGE_GEN_SIMULATE=${IMAGE_GEN_SIMULATE:-}
      - IMAGE_UPLOAD_MAX_INPUT_BYTES=${IMAGE_UPLOAD_MAX_INPUT_BYTES:-15728640}
      - FILE_UPLOAD_MAX_BYTES=${FILE_UPLOAD_MAX_BYTES:-26214400}
      - INTERNAL_CLIENT_PORTAL_KEY=${INTERNAL_CLIENT_PORTAL_KEY}
      # Telephony / Dialer (Kommuno)
      - KOMMUNO_API_KEY=${KOMMUNO_API_KEY}
      - KOMMUNO_SME_ID=${KOMMUNO_SME_ID}
      - KOMMUNO_VIRTUAL_NUMBER=${KOMMUNO_VIRTUAL_NUMBER}
      - KOMMUNO_API_BASE_URL=${KOMMUNO_API_BASE_URL:-${KOMMUNO_BASE_URL:-https://dialer-crmapi.kommuno.com/v1/kcrm}}
      - KOMMUNO_BASE_URL=${KOMMUNO_BASE_URL:-${KOMMUNO_API_BASE_URL:-https://dialer-crmapi.kommuno.com/v1/kcrm}}
      - KOMMUNO_WEBHOOK_SECRET=${KOMMUNO_WEBHOOK_SECRET}
      # WhatsApp (AiSensy)
      - AISENSY_WEBHOOK_SECRET=${AISENSY_WEBHOOK_SECRET}
      - AISENSY_API_BASE_URL=${AISENSY_API_BASE_URL:-https://backend.aisensy.com}

  frontend:
    image: ${FRONTEND_IMAGE:-myapp_frontend:latest}
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env}
        - NEXT_PUBLIC_CRM_API_URL=${NEXT_PUBLIC_CRM_API_URL:-}
        - NEXT_PUBLIC_CRM_STANDALONE=true
    container_name: 2bighacrm-frontend
    restart: always
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.2bighacrm-frontend.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.2bighacrm-frontend.priority=1"
      - "traefik.http.routers.2bighacrm-frontend.entrypoints=websecure"
      - "traefik.http.routers.2bighacrm-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.2bighacrm-frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
    name: 2bighacrm_mongodb_data
  redis_data:
    name: 2bighacrm_redis_data
  uploads_data:
    name: 2bighacrm_uploads_data